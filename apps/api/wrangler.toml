# Cloudflare Worker — busqueda-tesoro-api
# Phase 1: local walking skeleton — D1 enabled for local dev.

name = "busqueda-tesoro-tutorias"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# One same-origin Worker deployment: API runs first for /api/*; all React
# routes use the static SPA fallback. `apps/web/dist` is produced by npm run build.
assets = { directory = "../web/dist", not_found_handling = "single-page-application", run_worker_first = ["/api/*", "/health"] }

# D1 database binding.
# database_id is a placeholder UUID — only used for local dev via --local flag.
# Local D1 data lives in .wrangler/state/v3/d1/ (NOT on Cloudflare servers).
# For production, replace with the real UUID from: wrangler d1 create busqueda-tesoro-db
[[d1_databases]]
binding = "DB"
database_name = "busqueda-tesoro-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../migrations"

[vars]
ENVIRONMENT = "development"

[env.production]
name = "busqueda-tesoro-tutorias"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "busqueda-tesoro-tutorias-prod"
database_id = "3dda2aac-7453-4d6e-ae54-282c1a956cc9"
migrations_dir = "../../migrations"
